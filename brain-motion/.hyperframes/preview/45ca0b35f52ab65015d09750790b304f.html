    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root { --ink: #07111f; --cyan: #61f4ff; --violet: #9d8cff; --pink: #ff7aca; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
      body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(ellipse at 50% 48%, rgba(71,62,170,.23) 0%, rgba(11,21,45,.88) 46%, #050b17 100%); }
      .grid { position: absolute; inset: -20%; opacity: .16; background-image: linear-gradient(rgba(104,224,255,.18) 1px, transparent 1px), linear-gradient(90deg, rgba(104,224,255,.18) 1px, transparent 1px); background-size: 70px 70px; transform-origin: center bottom; }
      .halo { position: absolute; left: 50%; top: 50%; width: 700px; height: 700px; transform: translate(-50%,-50%); border-radius: 50%; border: 1px solid rgba(97,244,255,.22); box-shadow: 0 0 80px rgba(97,244,255,.13), inset 0 0 80px rgba(157,140,255,.11); }
      .halo::after { content: ''; position: absolute; inset: 42px; border-radius: 50%; border: 1px solid rgba(255,122,202,.18); }
      #brain-stage { position: absolute; left: 50%; top: 50%; width: 940px; height: 680px; transform: translate(-50%,-50%); transform-style: preserve-3d; }
      #brain-svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 24px 35px rgba(0,0,0,.35)); }
      .brain-shell { fill: url(#brainFill); stroke: rgba(187,239,255,.9); stroke-width: 5; }
      .brain-inner { fill: none; stroke: rgba(104,238,255,.34); stroke-width: 3; }
      .fold { fill: none; stroke: rgba(242,209,255,.55); stroke-width: 5; stroke-linecap: round; }
      .synapse-lines { fill: none; stroke: rgba(97,244,255,.46); stroke-width: 2; stroke-dasharray: 8 13; }
      .node { fill: #d5fcff; stroke: #61f4ff; stroke-width: 3; }
      .pulse { fill: #fff; filter: url(#glow); }
      .orbit { fill: none; stroke: rgba(157,140,255,.42); stroke-width: 2; stroke-dasharray: 10 18; }
      .label { position: absolute; color: rgba(206,246,255,.86); font-size: 22px; letter-spacing: .18em; text-transform: uppercase; }
      #label-left { left: 62px; top: 280px; }
      #label-right { right: 62px; top: 280px; text-align: right; }
      .label::before { content: ''; display: inline-block; width: 8px; height: 8px; margin: 0 14px 3px 0; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 14px var(--cyan); }
      #label-right::before { display: none; }
      #label-right::after { content: ''; display: inline-block; width: 8px; height: 8px; margin: 0 0 3px 14px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 14px var(--pink); }
      #caption { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); color: rgba(214,246,255,.72); font-size: 20px; letter-spacing: .42em; text-transform: uppercase; white-space: nowrap; }
      #caption strong { color: #fff; font-weight: 500; }
      .micro { position: absolute; color: #d5f6ff; font-size: 13px; letter-spacing: .15em; }
      #micro-a { left: 84px; bottom: 72px; } #micro-b { right: 84px; bottom: 72px; }
